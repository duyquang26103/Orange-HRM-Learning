name: Diem Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "run all test suite."
        required: false
        default: "all"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run WebdriverIO tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BROWSER: ${{ matrix.browser }}
          SUITE: ${{ github.event.inputs.suite || 'all' }}
        run: |
          if [ "$SUITE" = "all" ]; then
            pnpm run wdio
          else
            pnpm exec wdio run ./wdio.conf.js --suite "$SUITE"
          fi

      # Upload screenshot khi fail — luôn chạy kể cả test fail
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # Upload Allure results — luôn chạy để có report dù pass/fail
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7

  generate-allure-report:
    name: Generate Allure Report
    needs: [smoke-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Result Desktop
        uses: actions/download-artifact@v7
        with:
          name: result
          path: allure-results

      - name: Checkout code
        uses: actions/checkout@v6
        continue-on-error: true # in case run without branch for GitHub page source
        with:
          ref: allure-reports
          path: allure-reports

      - uses: simple-elf/allure-report-action@master
        id: generate-allure-report
        with:
          allure_results: allure-results
          gh_pages: allure-reports
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 15

      - name: Deploy report to Github Pages
        id: deploy-allure-report-page
        if: ${{ steps.generate-allure-report.outcome == 'success' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: allure-reports
          publish_dir: allure-history
