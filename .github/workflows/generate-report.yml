name: Generate-Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "run all test suite."
        required: false
        default: "all"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run WebdriverIO tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BROWSER: ${{ matrix.browser }}
          SUITE: ${{ github.event.inputs.suite || 'all' }}
        run: |
          if [ "$SUITE" = "all" ]; then
            pnpm run wdio
          else
            pnpm exec wdio run ./wdio.conf.js --suite "$SUITE"
          fi

      # Upload screenshot khi fail — luôn chạy kể cả test fail
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      # Upload Allure results — luôn chạy để có report dù pass/fail
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 7
  publish-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Tải allure-results (kết quả thô) mà job test đã upload
      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      # Lấy lịch sử report cũ từ branch allure
      # Lần đầu chưa có branch → continue-on-error bỏ qua lỗi
      - name: Load report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: allure
          path: gh-pages # ← checkout branch vào thư mục 'gh-pages'

      # Generate report có gộp lịch sử
      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results # kết quả lần này
          gh_pages: gh-pages # ← ĐỌC lịch sử cũ từ đây (thư mục vừa checkout)
          allure_history: allure-history # ← GHI report mới ra đây (một tầng)
          keep_reports: 30
          allure_report: allure-report

      # Publish lên branch allure
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: allure-report
          publish_dir: allure-history # khớp với allure_history ở trên
